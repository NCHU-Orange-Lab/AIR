# AIR 專案設定
#
# 這個檔案屬於這個專案，更新 AIR 時不會被覆蓋。
# 規則本身的預設值在 AIR/config.toml（屬於套件，不要在專案裡修改）。

[project]
package = "{package}"           # 套件的 import 名稱
package-dir = "{package_dir}"   # 套件目錄（相對專案根目錄）；各層是它底下的子套件
tests-dir = "{tests_dir}"             # 測試目錄（會放入 TEST 規則）；測試放在套件裡面時指向那個子目錄，它們就不算舊模組

[imports]
# 純的層額外允許 import 的外部模組。新增前要經使用者同意。
# 只放「資料函式庫」（純計算、陣列型別，例如 scipy；或經同意讓 torch 的張量跨層當資料用）；
# 工具（模型、外部服務）不加，包成 adapter（見 skill air-wrap-tool）。
extra = []

[migration]
# 遷移階段：installed → analyzed → planned → layered → migrating → done
phase = "installed"

# 遷移期間，暫時允許某一層 import 尚未遷移的舊模組。每一項都要寫原因，並經使用者同意；
# 遷移完成（phase = "done"）之前必須清空。
allow-legacy = [
  # { from = "steps", module = "shop.utils", reason = "第 2 批才搬，暫時共用 parse_amount" },
]

# 不歸 AIR 管的路徑（相對專案根目錄的目錄或檔案，可以寫成 dir/**）：實驗區、腳本、筆記本。
# 不凍結、不進驗收指紋、不列進 survey 與層外模組清單；留在外面算正式的結局，原因寫在遷移報告。
# 層目錄底下的檔案不受影響（一律檢查）。新增前要經使用者同意。
exclude = [
  # "{package_dir}/experiments",
]

[tests]
# 每批 verify 跑的測試指令（shell 字串，在專案根目錄執行），分析階段由 AI 確認後填入，例如 "pytest -q --junit-xml=.air/test-results.xml"
command = ""
timeout = 600                   # 上限（秒）
# results：指令寫出的 JUnit XML。有它 verify 才分得出「本來就失敗的」與「新增的失敗」：分析階段 verify --record-baseline 記下既有失敗
# （.air/test-baseline.json，進版本控制），之後失敗都在基準裡就算通過。沒設就只認結束碼 0
# results = ".air/test-results.xml"
# baseline = ".air/test-baseline.json"

# [tests.final]
# 收尾（verify --scope final）跑的完整套件；沒設就用 [tests]。每批只跑快的，收尾才跑全部（對齊 TEST-3 的慢速標記）
# command = "pytest -q --junit-xml=.air/final.xml"
# timeout = 3600
# results = ".air/final.xml"

# [[tests.golden]]
# 黃金重播：固定輸入跑一次，python3 AIR/air.py golden record 記下 outputs 的 sha256（.air/golden.json，進版本控制），
# 之後 verify 重跑比對。沒有測試的部分用它鎖住行為（TEST-5）。輸出要是確定的：seed 固定、不含時間戳。重錄只由使用者決定
# name = "smoke"
# command = "python -m {package} --config conf/smoke.yml"
# outputs = ["reports/smoke/metrics.json"]
# timeout = 900
# scope = ["batch", "final"]

# [verify]
# 驗收指紋除了套件目錄、測試目錄、這個檔案與 AIR 之外，還要看的路徑（改了就讓驗收過期）
# fingerprint-extra = ["conftest.py", "pyproject.toml"]

# [hooks]
# 結束前的檢查範圍：session（預設）只查這個 session 動過的檔案（編輯工具記下的，加上 session 開始後內容變了的層內 .py），
# 別的 session 的半成品不會要這個 session 去修；all 是整個專案。套件與接點的完整性（AIR009）兩種都查。
# stop-scope = "session"
