# AIR 專案設定
#
# 這個檔案屬於這個專案，更新 AIR 時不會被覆蓋。
# 規則本身的預設值在 AIR/config.toml（屬於套件，不要在專案裡修改）。

[project]
package = "{package}"           # 套件的 import 名稱
package-dir = "{package_dir}"   # 套件目錄（相對專案根目錄）；各層是它底下的子套件
tests-dir = "tests"             # 測試目錄（會放入 TEST 規則）

[imports]
# 純的層額外允許 import 的外部模組。新增前要經使用者同意。
# 只放「資料函式庫」（純計算、陣列型別，例如 scipy；或經同意讓 torch 的張量跨層當資料用）；
# 工具（模型、外部服務）不加，包成 adapter（見 skill air-wrap-tool）。
extra = []

[migration]
# 遷移階段：installed → analyzed → planned → layered → migrating → done
phase = "installed"

# 遷移期間，暫時允許某一層 import 尚未遷移的舊模組。每一項都要寫原因，並經使用者同意；
# 遷移完成（phase = "done"）之前必須清空。
allow-legacy = [
  # { from = "steps", module = "shop.utils", reason = "第 2 批才搬，暫時共用 parse_amount" },
]

# 不歸 AIR 管的路徑（相對專案根目錄的目錄或檔案，可以寫成 dir/**）：實驗區、腳本、筆記本。
# 不凍結、不進驗收指紋、不列進 survey 與層外模組清單；留在外面算正式的結局，原因寫在遷移報告。
# 層目錄底下的檔案不受影響（一律檢查）。新增前要經使用者同意。
exclude = [
  # "{package_dir}/experiments",
]

[tests]
# 每批 verify 跑的測試指令（shell 字串，在專案根目錄執行），分析階段由 AI 確認後填入，例如 "pytest -q"
command = ""
timeout = 600                   # 上限（秒）

# [verify]
# 驗收指紋除了套件目錄、測試目錄、這個檔案與 AIR 之外，還要看的路徑（改了就讓驗收過期）
# fingerprint-extra = ["conftest.py", "pyproject.toml"]

# [hooks]
# 結束前的檢查範圍：session（預設；2.7.1 起只查這個 session 動過的檔與工作樹未提交的層內變更）或 all（整個專案）
# stop-scope = "session"
