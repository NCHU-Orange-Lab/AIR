# AIR 套件自己的測試：push 到 main 與每個 pull request 都在 GitHub 上跑一次。
# 套件零相依，只用標準庫，所以不需要 pip install；指令與本機相同：
#   python3 -m unittest discover -s tests -t .
# 注意：這裡不跑 python air.py check，它需要 .air/project.toml（裝好 AIR 的專案才有），在套件 repo 本身會直接報錯。
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -t .
